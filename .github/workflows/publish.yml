name: Release & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  build:
    name: Build packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Build server package
        run: python -m build --outdir dist/

      - name: Build client package
        run: python -m build --outdir dist/
        working-directory: client

      - name: Check package metadata
        run: twine check --strict dist/* client/dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            client/dist/

  github-release:
    name: Create GitHub Release
    needs: [publish-server, publish-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: artifacts

      - name: Collect all dist files
        run: |
          mkdir -p release-assets
          find artifacts -name '*.whl' -o -name '*.tar.gz' | xargs -I{} cp {} release-assets/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Mimir ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/*

  publish-server:
    name: Publish mimir-context-server to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: artifacts

      - name: Collect server dist
        run: |
          mkdir -p dist
          cp artifacts/dist/mimir_context_server* dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-client:
    name: Publish mimir-server-client to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: artifacts

      - name: Collect client dist
        run: |
          mkdir -p dist
          cp artifacts/client/dist/mimir_server_client* dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
