[build-system]
requires = ["setuptools>=84.0", "wheel>=0.48", "setuptools-scm>=10.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir-context-server"
dynamic = ["version"]
description = "Mimir — Context Server: intelligent code context engine for LLMs working with large, multi-repo codebases"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "context", "code", "llm", "rag", "code-graph", "embeddings", "mimir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "networkx>=3.6.1",
    "gitpython>=3.2.0",
    "typer>=0.27.2",
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
    "huggingface-hub>=1.33.0",
    "numpy>=2.4.6",
    "tree-sitter-language-pack>=1.20.0",
    "aiohttp>=3.14.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "watchdog>=6.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/repfly/mimir"
Repository = "https://github.com/repfly/mimir"
Issues = "https://github.com/repfly/mimir/issues"

[project.scripts]
mimir = "mimir.adapters.cli:app"

[tool.setuptools.packages.find]
include = ["mimir*"]

[tool.setuptools.package-data]
"mimir.adapters.web" = ["static/**/*"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
